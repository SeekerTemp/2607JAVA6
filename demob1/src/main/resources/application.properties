spring.application.name=demob1
server.port=8080

# H2 in-memory DB (per pom.xml comment: "tat app la mat")
spring.datasource.url=jdbc:h2:mem:notesdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# seed sample rows from request_labs8.2 after Hibernate creates the schema
spring.sql.init.mode=always
