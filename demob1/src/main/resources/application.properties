spring.application.name=demob1
server.port=8081

# LAB 8 - WebSocket chat (danh sách online lưu trong bộ nhớ)

# LAB 8 - Lưu lịch sử tin nhắn: H2 chạy in-memory nên tắt app đi bật lại là reset sạch
spring.datasource.url=jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Xem dữ liệu chat đã lưu tại http://localhost:8081/h2-console (JDBC URL: jdbc:h2:mem:chatdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
