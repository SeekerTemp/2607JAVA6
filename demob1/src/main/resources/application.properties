spring.application.name=demob1
server.port=8080

# ===== SQL Server - database NotesDB theo NotesDB.sql cua de bai =====
# Chay NotesDB.sql mot lan bang SSMS truoc khi chay app.
# Doi user/password cho dung may ban, hoac dat bien moi truong MSSQL_USER / MSSQL_PASSWORD.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NotesDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${MSSQL_USER:sa}
spring.datasource.password=${MSSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Dung dung bang Notes do NotesDB.sql tao ra, khong cho Hibernate sinh hay sua schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Du lieu mau da nam trong NotesDB.sql roi, khong seed them tu app
spring.sql.init.mode=never
