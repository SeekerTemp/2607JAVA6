<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:if="${@authService.isLogin()}">
    <hr>
    <h3>Thông tin tài khoản</h3>
    <p>
        Email:
        <b th:text="${@authService.getEmail()}"></b>
    </p>
    <a href="/logout">Đăng xuất</a>
</div>
<div th:unless="${@authService.isLogin()}">
    <hr>
    <a href="/login">Đăng nhập</a>
    <div th:replace="~{user-info :: *}"></div>
</div>
</body>
</html>
