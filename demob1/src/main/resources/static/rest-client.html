<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESTful Web API</title>
</head>
<body>
<h3>RESTful Web API</h3>
<hr>
<button onclick="doGetAll()">Get All</button>
<button onclick="doGetByKey()">Get By Key</button>
<button onclick="doPost()">Post</button>
<button onclick="doPut()">Put</button>
<button onclick="doDelete()">Delete</button>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    // Thay bằng host Realtime Database của bạn, ví dụ:
    // https://<project-id>-default-rtdb.firebaseio.com
    const host = "https://fpolyedu.firebaseio.com";

    function doGetAll() {
        var url = `${host}/students.json`;
        axios.get(url).then(resp => {
            console.log("Success", resp.data);
        }).catch(error => {
            console.log("Error", error);
        });
    }

    function doGetByKey() {
        var key = prompt("Nhập key của sinh viên:", "<<key>>");
        var url = `${host}/students/${key}.json`;
        axios.get(url).then(resp => {
            console.log("Success", resp.data);
        }).catch(error => {
            console.log("Error", error);
        });
    }

    function doPost() {
        var url = `${host}/students.json`;
        var data = {
            "id": "SV99",
            "name": "Sinh viên 99",
            "mark": 4.5,
            "gender": true
        };
        axios.post(url, data).then(resp => {
            console.log("Success", resp.data);
        }).catch(error => {
            console.log("Error", error);
        });
    }

    function doPut() {
        var key = prompt("Nhập key cần cập nhật:", "<<key>>");
        var url = `${host}/students/${key}.json`;
        var data = {
            "id": "SV00",
            "name": "Sinh viên 00",
            "mark": 8.5,
            "gender": true
        };
        axios.put(url, data).then(resp => {
            console.log("Success", resp.data);
        }).catch(error => {
            console.log("Error", error);
        });
    }

    function doDelete() {
        var key = prompt("Nhập key cần xóa:", "<<key>>");
        var url = `${host}/students/${key}.json`;
        axios.delete(url).then(resp => {
            console.log("Success", resp.data);
        }).catch(error => {
            console.log("Error", error);
        });
    }
</script>
</body>
</html>
