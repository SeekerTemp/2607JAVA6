<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Online</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #app { max-width: 640px; border: 3px solid #29b6d8; border-radius: 6px; padding: 16px; }
        .row { margin-bottom: 12px; }
        .msg-list { list-style: disc; padding-left: 24px; }
        .users { border: 1px solid #ccc; padding: 8px; min-width: 160px; }
        .layout { display: flex; gap: 16px; }
        .col { flex: 1; }
        button:disabled { opacity: .5; }
        .join { color: green; } .leave { color: #b00; }
    </style>
</head>
<body>
<div id="app">
    <div class="row">
        <input v-model="username" placeholder="Tên của bạn" :disabled="connected">
        <button @click="connect" :disabled="connected || !username">Connect</button>
        <button @click="disconnect" :disabled="!connected">Disconnect</button>
    </div>

    <div class="layout">
        <div class="col">
            <h4>OUTPUT</h4>
            <ul class="msg-list">
                <li v-for="(m, i) in messages" :key="i" :class="m.type==='JOIN' ? 'join' : (m.type==='LEAVE' ? 'leave' : '')">
                    <template v-if="m.type==='CHAT'"><b>{{ m.sender }}</b>: {{ m.content }}</template>
                    <template v-else><i>{{ m.content }}</i></template>
                </li>
            </ul>
        </div>
        <div class="users">
            <h4>ĐANG ONLINE</h4>
            <ul>
                <li v-for="(u, i) in onlineUsers" :key="i">{{ u }}</li>
            </ul>
        </div>
    </div>

    <hr>
    <h4>INPUT</h4>
    <div class="row">
        Message:
        <input v-model="content" @keyup.enter="send" :disabled="!connected">
        <button @click="send" :disabled="!connected">Send</button>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script>
    Vue.createApp({
        data() {
            return {
                username: "",
                content: "",
                messages: [],
                onlineUsers: [],
                connected: false,
                client: null
            };
        },
        methods: {
            connect() {
                // Tạo STOMP client qua SockJS
                this.client = new StompJs.Client({
                    webSocketFactory: () => new SockJS("/ws")
                });

                this.client.onConnect = () => {
                    this.connected = true;
                    // Nhận tin nhắn công khai
                    this.client.subscribe("/topic/public", (frame) => {
                        var msg = JSON.parse(frame.body);
                        this.messages.push(msg);
                        // Cập nhật danh sách online khi có JOIN/LEAVE
                        if (msg.users) {
                            this.onlineUsers = msg.users;
                        }
                    });
                    // Gửi username để tham gia
                    this.client.publish({
                        destination: "/app/username",
                        body: JSON.stringify({ sender: this.username })
                    });
                };

                this.client.onStompError = (frame) => {
                    console.log("STOMP error", frame);
                };

                this.client.activate();
            },

            disconnect() {
                if (this.client) {
                    this.client.deactivate();
                }
                this.connected = false;
                this.onlineUsers = [];
            },

            send() {
                if (!this.content.trim()) return;
                this.client.publish({
                    destination: "/app/chat",
                    body: JSON.stringify({ sender: this.username, content: this.content })
                });
                this.content = "";
            }
        }
    }).mount("#app");
</script>
</body>
</html>
