# Test chay tren H2 o che do tuong thich SQL Server, dung DUNG schema cua NotesDB.sql
# (xem src/test/resources/schema.sql) de khong can bat SQL Server moi chay duoc test.
spring.datasource.url=jdbc:h2:mem:notesdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# giong app that: khong cho Hibernate sinh schema, chi dung bang co san
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
