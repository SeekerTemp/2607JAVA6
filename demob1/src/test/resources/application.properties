# Cấu hình riêng cho kiểm thử.
# Các starter *-test (data-jpa-test) kéo theo autoconfigure của DataSource/JPA,
# nhưng LAB 6 không dùng CSDL -> tắt đi để ApplicationContext khởi động được.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# Không chiếm cổng 8080 khi chạy test
server.port=0
