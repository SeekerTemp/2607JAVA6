spring.application.name=demau
server.port=8080

# ===== SQL Server - database DeMauSOF3062 theo ref/DeMau.sql =====
# Chay ref/DeMau.sql mot lan bang SSMS truoc khi chay app.
# Doi user/password cho dung may ban, hoac dat bien moi truong MSSQL_USER / MSSQL_PASSWORD.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DeMauSOF3062;encrypt=true;trustServerCertificate=true
spring.datasource.username=${MSSQL_USER:sa}
spring.datasource.password=${MSSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Dung dung 2 bang do DeMau.sql tao ra, khong cho Hibernate sinh hay sua schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# Du lieu mau da nam trong DeMau.sql roi, khong seed them tu app
spring.sql.init.mode=never

# Muc 9: tai khoan mac dinh MSSV / Lop
spring.security.user.name=PH12345
spring.security.user.password=SOF3062
